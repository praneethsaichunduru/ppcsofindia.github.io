<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics. It is not loaded when the site is opened on this computer (localhost / a file), so
         testing and previewing never add visits to the real figures. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && location.protocol !== 'file:') {
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZB7NNS4QNG';
        document.head.appendChild(ga);
        gtag('js', new Date());
        gtag('config', 'G-ZB7NNS4QNG');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2540" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/data/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('ppc-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>PPCs of India</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
